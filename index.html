.logo{display:block;margin:0 auto 14px;width:min(86%,340px);height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
.ttl{direction:ltr;font-size:1.55rem;line-height:1.3;margin:0;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:1.35rem;line-height:1.5;margin:0 0 4px;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand svg{flex:none}
.brand b{display:block;font-size:1.15rem;line-height:1.3;direction:ltr;text-align:right}
.brand small{color:var(--muted)}
h1{font-size:1.35rem;line-height:1.5;margin:0 0 4px;font-weight:700}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.row{display:flex;gap:10px;margin-top:14px}
input{flex:1;min-width:0;font-family:inherit;font-size:1rem;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);direction:ltr;text-align:left}
.btn{font-family:inherit;font-size:1rem;font-weight:700;border:0;border-radius:10px;padding:0 24px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);margin:12px 0 0}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:35%;background:var(--brand);border-radius:3px}
@media (prefers-reduced-motion: no-preference){
  .bar i{animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  .res{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
[dir="rtl"] .bar i{margin-inline-start:0}

.res{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{width:120px;height:120px;flex:none}
.gauge text{fill:var(--ink);font-family:inherit}
.verdict{flex:1;min-width:180px}
.v{font-size:1.9rem;font-weight:700;line-height:1.35;margin:0}
.v.safe{color:var(--safe)} .v.bad{color:var(--bad)} .v.review{color:var(--warn)}
.hint{margin:6px 0 0;color:var(--muted)}
.target{margin-top:14px;padding:8px 12px;background:var(--chip);border-radius:8px;direction:ltr;text-align:left;word-break:break-all;font-size:.9rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1;min-width:90px;background:var(--chip);border-radius:10px;padding:8px 12px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.85rem;color:var(--muted)}
.err{background:var(--bad-bg);border:1px solid var(--bad);color:var(--ink);border-radius:12px;padding:14px 16px}
</style>
</head>

  var map = {
    safe:   {t:"آمن", c:"safe", col:"var(--safe)", h:""},
    bad:    {t:"ضار", c:"bad", col:"var(--bad)", h:"ماتفتحش الرابط ده."},
    review: {t:"راجع فريق الأمن السيبراني", c:"review", col:"var(--warn)", h:"ماتفتحش الرابط لحد ما الفريق يراجعه."}
  };
  var m = map[r.verdict] || map.review;
  var flagged = (r.malicious||0) + (r.suspicious||0);
  var C = 2 * Math.PI * 52;
  var html =
    '<div class="panel"><div class="res">'+
    '<svg class="gauge" viewBox="0 0 120 120" role="img" aria-label="'+flagged+' من '+r.total+'">'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="'+m.col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>'+
      '<text x="60" y="62" text-anchor="middle" font-size="30" font-weight="700">'+flagged+'</text>'+
      '<text x="60" y="84" text-anchor="middle" font-size="12">/ '+r.total+'</text>'+
    '</svg>'+
    '<div class="verdict"><p class="v '+m.c+'">'+m.t+'</p>'+(m.h?'<p class="hint">'+m.h+'</p>':'')+'</div></div>'+
    '<div class="target" id="tg"></div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+(r.malicious||0)+'</b><span>ضار</span></div>'+
      '<div class="stat"><b>'+(r.suspicious||0)+'</b><span>مشبوه</span></div>'+
      '<div class="stat"><b>'+((r.harmless||0)+(r.undetected||0))+'</b><span>سليم</span></div>'+
    '</div></div>';
  $("out").innerHTML = '<div class="res-wrap">'+html+'</div>';
  $("tg").textContent = raw;
  $("out").scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function scan(){
  if(busy) return;
  var raw = $("u").value.trim();
  if(!raw){ showErr("الصق الرابط الأول."); return; }
  if(raw.length > 2000 || /\s/.test(raw)){ showErr(msg("invalid")); return; }

  busy = true; $("go").disabled = true; showScanning();
  var t0 = Date.now(), LIMIT = 210000;
  try{
    var r;
    while(true){
      r = await call({action:"scan", url:raw});
      if(r.ok || r.error !== "busy") break;
      if(Date.now() - t0 > LIMIT) break;
      await sleep(15000);
    }
    if(!r.ok){ showErr(msg(r.error)); return; }
    if(r.done){ showResult(r.result, raw); return; }

    var id = r.id, first = true;
    while(Date.now() - t0 < LIMIT){
      await sleep(first ? 12000 : 20000); first = false;
      var q = await call({action:"result", id:id, url:raw});
      if(q.ok && q.done){ showResult(q.result, raw); return; }
      if(!q.ok && q.error !== "busy"){ showErr(msg(q.error)); return; }
    }
    showErr(msg("busy"));
  }catch(e){
    showErr(msg("net"));
  }finally{
    busy = false; $("go").disabled = false; stopTimer();
  }
}

$("go").onclick = scan;
$("u").addEventListener("keydown", function(e){ if(e.key === "Enter") scan(); });
</script>
</body>
</html>
